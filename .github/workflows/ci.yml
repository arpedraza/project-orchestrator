name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner-registry-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python utilities
        run: python -m compileall -q scripts tests
      - name: Validate JSON schema documents
        run: python -m json.tool schemas/project-state.schema.json >/dev/null && python -m json.tool schemas/work-item.schema.json >/dev/null && python -m json.tool schemas/dependency.schema.json >/dev/null && python -m json.tool schemas/gate.schema.json >/dev/null && python -m json.tool schemas/state-bundle.schema.json >/dev/null
      - name: Run scanner, registry, and state regression tests
        run: python -m unittest discover -s tests -v
